<!doctype html>
<!--
[INPUT]: 依赖 React 原 Hero/主题/样式、Canvas 2D 和浏览器可见性/减弱动态偏好
[OUTPUT]: 提供全幅港口背景试验：道路退界、建筑/堆场/油罐分区、码头吊机横移、昼夜照明、车灯与水面反光
[POS]: 根目录的 React 背景验收页；通过共享 ReactYgbPortBackground 复用正式 Hero 的场景，不改变 Vue
[PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云柜宝 · 港口背景预览</title>
<style>
.preview-canvas{display:block;width:100%;height:100%}
.preview-tools{display:flex;align-items:center;flex-wrap:wrap;gap:12px;max-width:1440px;margin:auto;padding:22px 56px;color:rgb(var(--color-text-secondary)/var(--color-text-secondary-opacity));font-size:12px}
.preview-tools button{cursor:pointer;white-space:nowrap;font:inherit;border:1px solid rgb(var(--color-edge)/var(--color-edge-opacity));background:rgb(var(--color-surface));padding:8px 14px;border-radius:999px;color:rgb(var(--color-text-primary))}
.preview-tools button[aria-pressed="true"]{background:rgb(var(--color-ink));color:rgb(var(--color-bg))}
.preview-tools button:focus-visible{outline:2px solid #fb923c;outline-offset:3px}
.preview-tools button:disabled{opacity:.45;cursor:default}
/* 原 Hero 的文案保护仍在，但把底色降到半透明，保留港区日照和夜景的空间层次。 */
#hero-preview > section > div.relative.overflow-hidden{background-color:rgb(var(--color-bg)/.82)!important}
.dark #hero-preview > section > div.relative.overflow-hidden{background-color:rgb(var(--color-bg)/.76)!important}
.background-only #hero-preview > section > div > div:last-child{visibility:hidden}
.background-only #hero-preview > section > div > div.pointer-events-none:not(:first-child){display:none}
@media(max-width:760px){.preview-tools{padding:18px 20px;gap:8px}.preview-tools>span{width:100%}}
</style>
</head>
<body>
<div id="preview-root"></div>
<script type="module">
import {createElement as h,useEffect,useState} from 'react';
import {createRoot} from 'react-dom/client';
import {ReactYgbHero} from '/src/react/pages/ReactYgbHero.tsx';
import {ReactYgbPortBackground} from '/src/react/pages/ReactYgbPortBackground.tsx';
import {ThemeProvider,useTheme} from '/src/react/providers/ThemeProvider.tsx';
import logo from '/src/assets/logo.webp';
import '/src/style.css';
import '/src/styles/remixicon-used.css';
import '/src/react/motion.css';

/* --- 原 UI 复用：Hero 的文案、图片和叠卡由正式组件提供，原型只承载背景验收控制 --- */
function Preview(){
 const {isDark,toggleTheme}=useTheme(),[backgroundOnly,setBackgroundOnly]=useState(false),[paused,setPaused]=useState(false),[reduced,setReduced]=useState(()=>matchMedia('(prefers-reduced-motion: reduce)').matches);
 useEffect(()=>{const query=matchMedia('(prefers-reduced-motion: reduce)'),change=()=>setReduced(query.matches);query.addEventListener('change',change);return()=>query.removeEventListener('change',change);},[]);
 return h('div',{className:backgroundOnly?'background-only':''},
  h('header',{className:'fixed left-0 right-0 top-0 z-40 bg-bg'},h('div',{className:'relative flex h-14 items-center justify-between px-4 md:px-6'},
   h('a',{href:'/ygb',className:'flex items-center gap-2','aria-label':'返回云柜宝页面'},h('img',{src:logo,alt:'企丰科技',className:'h-8 w-8 rounded-sm object-cover'}),h('span',{className:'select-none text-sm font-medium'},'企丰科技')),
   h('button',{type:'button',className:'inline-flex btn-icon btn-icon-md btn-icon-muted',onClick:toggleTheme,'aria-label':isDark?'切换到浅色模式':'切换到深色模式'},h('i',{className:isDark?'ri-sun-line text-lg':'ri-moon-clear-line text-lg','aria-hidden':true}))
  )),
   h('main',{className:'pt-14'},h('div',{id:'hero-preview'},h(ReactYgbHero,{background:h(ReactYgbPortBackground,{isDark,paused,className:'preview-canvas'})})),
   h('div',{className:'preview-tools','aria-label':'背景验收控制'},h('span',null,'背景预览'),h('button',{type:'button','aria-pressed':backgroundOnly,onClick:()=>setBackgroundOnly(!backgroundOnly)},backgroundOnly?'显示原文字与卡片':'仅看背景'),h('button',{type:'button','aria-pressed':paused||reduced,disabled:reduced,onClick:()=>setPaused(!paused)},paused||reduced?'继续背景动画':'暂停背景动画'))
  )
 );
}
createRoot(document.getElementById('preview-root')).render(h(ThemeProvider,null,h(Preview)));
</script>
</body>
</html>
